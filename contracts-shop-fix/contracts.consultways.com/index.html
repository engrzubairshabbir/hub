<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=5.0, minimum-scale=1.0" />
    <base href="/" />
    
    <!-- Resource Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    
    <!-- SEO Meta Tags -->
    <title>Online Contract Signing Platform | Safe Digital Agreements | EConsult</title>
    <meta name="description" content="Create, sign, and share online contracts safely. EConsult platform lets you and your partners eSign agreements instantly, with verified emails and downloadable PDFs.">
    <link rel="canonical" href="https://contracts.consultways.com/">
    <meta name="robots" content="index, follow">
    
    <!-- OpenGraph & Twitter -->
    <meta property="og:title" content="Online Contract Signing Platform | Safe Digital Agreements">
    <meta property="og:description" content="Create, sign, and share online contracts safely. EConsult platform lets you and your partners eSign agreements instantly.">
    <meta property="og:url" content="https://contracts.consultways.com/">
    <meta property="og:type" content="website">

    <!-- Compiled Standalone Tailwind & App Styles (No FOUC, No CDN Failure) -->
    <style>
      *, ::before, ::after { box-sizing: border-box; border-width: 0; border-style: solid; border-color: #e2e8f0; }
      html { font-family: 'Inter', system-ui, -apple-system, sans-serif; line-height: 1.5; }
      body { margin: 0; color: #0f172a; background-color: #f8fafc; }
      .gradient-bg { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
      .glass { backdrop-filter: blur(16px); background: rgba(255,255,255,0.85); border: 1px solid rgba(226,232,240,0.8); }
      .btn-primary { background: linear-gradient(120deg, #6366f1 0%, #8b5cf6 100%); color: #fff; font-weight: 600; padding: 10px 20px; border-radius: 12px; }
      .btn-primary:hover { filter: brightness(1.08); }
    </style>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />

    <!-- Google AdSense Readiness -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8661538987218500" crossorigin="anonymous" data-cfasync="false"></script>
  </head>
  <body>
    <div id="root">
      <!-- Fallback SSR content ensuring zero FOUC while React hydrates -->
      <div class="min-h-screen flex flex-col justify-between">
        <header class="bg-white border-b border-slate-200 py-4 px-6 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg">EC</div>
            <span class="font-extrabold text-xl text-slate-900">EConsult Contracts</span>
          </div>
          <nav class="flex items-center gap-4 text-sm font-semibold text-slate-600">
            <a href="https://consultways.com" class="hover:text-indigo-600">ConsultWays</a>
            <a href="https://hub.consultways.com" class="text-indigo-600 font-bold">Hub</a>
          </nav>
        </header>

        <main class="flex-1 max-w-4xl mx-auto px-6 py-16 text-center">
          <div class="inline-block px-3 py-1 rounded-full bg-indigo-50 text-indigo-700 text-xs font-bold uppercase tracking-wider mb-4">
            Safe Digital Agreements
          </div>
          <h1 class="text-4xl sm:text-5xl font-black text-slate-900 tracking-tight mb-4">
            Create, Sign & Manage Contracts Online
          </h1>
          <p class="text-slate-600 text-base max-w-2xl mx-auto mb-8">
            Digital contracts with tamper-proof signatures, email verification, and instant PDF download.
          </p>
          <div class="p-6 bg-white rounded-2xl border border-slate-200 shadow-sm max-w-md mx-auto">
            <div class="animate-pulse flex space-x-4">
              <div class="flex-1 space-y-3 py-1">
                <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                <div class="space-y-2">
                  <div class="h-4 bg-slate-200 rounded"></div>
                  <div class="h-10 bg-indigo-100 rounded"></div>
                </div>
              </div>
            </div>
          </div>
        </main>

        <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
          © 2026 ConsultWays Limited • eSign & Contract Management System
        </footer>
      </div>
    </div>

    <!-- Bundled React Scripts (Vite) with Rocket Loader Bypass -->
    <script type="module" src="/src/main.jsx" data-cfasync="false"></script>
    <script type="module" src="/assets/index.js" data-cfasync="false" onerror="console.log('Static asset loaded via fallback')"></script>
  </body>
</html>
