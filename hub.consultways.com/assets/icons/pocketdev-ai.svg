<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="pdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="pdRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="pdFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#pdBg)" />
  <circle cx="256" cy="230" r="140" stroke="url(#pdRing)" stroke-width="12" />
  
  <!-- Robot Head -->
  <rect x="180" y="150" width="152" height="120" rx="36" fill="url(#pdFace)" />
  <!-- Robot Eyes -->
  <circle cx="215" cy="200" r="16" fill="#090d16" />
  <circle cx="297" cy="200" r="16" fill="#090d16" />
  <circle cx="218" cy="197" r="5" fill="#00f0ff" />
  <circle cx="300" cy="197" r="5" fill="#00f0ff" />
  <!-- Antenna -->
  <line x1="256" y1="150" x2="256" y2="115" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="105" r="12" fill="#ec4899" />
  
  <!-- PocketDev AI Text Badge at bottom -->
  <rect x="110" y="380" width="292" height="60" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
  <text x="256" y="420" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">PocketDev AI</text>
